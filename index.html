<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nếp Giấy · Canva sang PDF</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f7;color:#133b34;font:17px/1.55 system-ui,sans-serif}header,main{max-width:750px;margin:auto;padding:24px}header{font-weight:750;border-bottom:1px solid #cadbd4}main{padding-top:clamp(40px,10vh,110px)}h1{font:500 clamp(2.7rem,7vw,4.5rem)/1.07 Georgia,serif;letter-spacing:-.05em;margin:0}p{margin:15px 0 25px}form{background:white;padding:clamp(18px,4vw,32px);border:1px solid #cfddd7;border-radius:18px}label{font-weight:650}input,button,a{font:inherit}input{display:block;width:100%;margin:8px 0 16px;padding:13px;border:1px solid #87a198;border-radius:8px}button,a.download{display:inline-block;background:#126352;color:white;padding:12px 20px;border-radius:8px;border:0;font-weight:650;cursor:pointer}button:disabled{opacity:.6}#status:empty{display:none}#status{margin-bottom:0}a{color:#126352}a[hidden]{display:none}small{display:block;margin-top:16px}
</style>
<header>Nếp Giấy</header><main><h1>Canva sang PDF</h1><p>Biến các slide trong link xem Canva thành một tệp PDF theo đúng thứ tự.</p>
<form><label for="url">Link trình chiếu Canva</label><input id="url" type="url" placeholder="https://www.canva.com/design/…/view" required>
<button>Tạo PDF</button><p id="status" role="status" aria-live="polite"></p><p id="setup" hidden>Chủ website có thể <a href="https://dashboard.render.com/blueprint/new?repo=https://github.com/duke-121/ghep-slide-pdf" target="_blank" rel="noopener noreferrer">mở cấu hình Render Free</a> để triển khai hoặc kiểm tra địa chỉ dịch vụ.</p><a id="file" hidden download="slide-canva.pdf">Tải lại PDF</a></form>
</main>
<script>
const form=document.querySelector('form'), input=document.querySelector('#url'), button=form.querySelector('button'), report=document.querySelector('#status'), file=document.querySelector('#file');
const hostedOnPages=location.hostname.endsWith('.github.io');
const endpoint=hostedOnPages ? 'https://nep-giay-duke-121.onrender.com/convert' : '/convert';

form.onsubmit=async event=>{
  event.preventDefault();
  let link;
  try{link=new URL(input.value.trim());if(!['www.canva.com','canva.com'].includes(link.hostname)||link.protocol!=='https:'||!/^\/design\/[\w-]+(?:\/[\w-]+)?\/view\/?$/.test(link.pathname))throw Error();}
  catch{report.textContent='Hãy dán link xem trình chiếu Canva có phần đuôi /view.';input.focus();return;}
  if(file.hasAttribute('href'))URL.revokeObjectURL(file.href);
  document.querySelector('#setup').hidden=true;
  file.hidden=true;button.disabled=true;report.textContent='Đang mở Canva và quét các trang. Hãy giữ trang này mở.';
  try {
    const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link:link.href})});
    if(!response.ok){const detail=await response.text();throw Error(detail && detail.length<500 && !detail.includes('<')?detail:'Chưa thể hoàn tất bản PDF. Vui lòng thử lại.');}
    if(!response.headers.get('Content-Type')?.startsWith('application/pdf'))throw Error('Bộ quét chưa trả về PDF.');
    file.href=URL.createObjectURL(await response.blob());file.hidden=false;file.click();
    report.textContent='PDF đã sẵn sàng.';
  }catch(error){const offline=error instanceof TypeError;
    report.textContent=offline?'Trình duyệt chưa liên lạc được với máy chủ quét. Chưa có PDF nào được tạo.':error.message;
    document.querySelector('#setup').hidden=!(hostedOnPages && offline);}
  finally{button.disabled=false;}
};
</script></html>
