<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nếp Giấy · Canva sang PDF</title><style>*{box-sizing:border-box}body{margin:0;background:#edf5f3;color:#183a36;font:17px/1.55 system-ui,sans-serif}main{max-width:690px;margin:10vh auto;padding:26px}h1{font:normal clamp(2.6rem,8vw,4.6rem)/1.05 Georgia,serif;margin:.5em 0}form{background:white;border-radius:16px;padding:24px}input,button{font:inherit;border-radius:8px;padding:12px}input{width:100%;border:1px solid #82a59b;margin:8px 0 16px}button{background:#125f50;color:white;border:0;cursor:pointer}button:disabled{opacity:.55}a{color:#125f50}</style><main><b>Nếp Giấy</b><h1>Canva sang PDF</h1><p>Dán link xem công khai. Máy chủ sẽ mở bài và ghép từng slide thành một trang PDF dạng ảnh.</p><form><label for="url">Link trình chiếu Canva</label><input id="url" type="url" required placeholder="https://www.canva.com/design/…/view"><button>Tạo PDF</button><p role="status" id="status"></p><a hidden id="file" download="slide-canva.pdf">Tải PDF</a></form></main><script>
const form=document.querySelector('form'),button=form.querySelector('button'),statusBox=document.querySelector('#status'),file=document.querySelector('#file');
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;if(file.href)URL.revokeObjectURL(file.href);file.hidden=true;statusBox.textContent='Đang mở Canva và quét các trang. Giữ trang này mở đến khi hoàn tất.';
try{const r=await fetch('/convert',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({link:document.querySelector('#url').value.trim()})});if(!r.ok){const message=await r.text();throw Error(message.startsWith('<')?'Máy chủ chưa phản hồi. Vui lòng thử lại.':message);}file.href=URL.createObjectURL(await r.blob());file.hidden=false;file.click();statusBox.textContent='Đã tạo PDF. Nếu trình duyệt chưa tải, hãy chọn Tải PDF.';}catch(e){statusBox.textContent=e.message;}finally{button.disabled=false;}};
</script></html>
